[project]
name = "shop-chat-ui"
version = "1.0.0"
description = "Chainlit chat UI for the AnyCompany Shop agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chainlit>=1.3.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
