[project]
name = "shop-mcp-server"
version = "1.0.0"
description = "MCP server exposing AnyCompany Shop order, inventory, and returns tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.12.1",
]

[project.scripts]
"shop-mcp" = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
