# Shop MCP server: business tools behind a protocol, shared by all agents.
#   envsubst < mcp-server.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-mcp
  namespace: mcp-servers
---
apiVersion: v1
kind: Service
metadata:
  name: shop-mcp
  namespace: mcp-servers
spec:
  selector:
    app.kubernetes.io/name: shop-mcp
  ports:
    - port: 8080
      targetPort: mcp
      name: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-mcp
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: shop-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-mcp
    spec:
      serviceAccountName: shop-mcp
      containers:
        - name: shop-mcp
          image: ${ECR_REPO_SHOP_MCP_URI}:latest
          ports:
            - containerPort: 8080
              name: mcp
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
