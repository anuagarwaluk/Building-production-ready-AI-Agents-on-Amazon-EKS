# vLLM serving Qwen2.5-3B-Instruct on AWS Inferentia (Neuron).
#
# NOTE: the container image below is a placeholder. Use the current
# vLLM Neuron image from the AWS Neuron Deep Learning Containers release
# notes (or build one from the vLLM repo's Neuron Dockerfile). The
# workshop's Workshop Studio environment pre-provisions this deployment;
# this manifest reproduces it for a standalone build.
apiVersion: v1
kind: Service
metadata:
  name: qwen2-5-3b-neuron
  namespace: vllm
spec:
  selector:
    app.kubernetes.io/name: qwen2-5-3b-neuron
  ports:
    - port: 8000
      targetPort: http
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen2-5-3b-neuron
  namespace: vllm
  labels:
    app.kubernetes.io/name: qwen2-5-3b-neuron
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen2-5-3b-neuron
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen2-5-3b-neuron
    spec:
      nodeSelector:
        workload: inference
      tolerations:
        - key: aws.amazon.com/neuron
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          # Placeholder: pin the current vLLM Neuron DLC image here
          image: ${VLLM_NEURON_IMAGE}
          args:
            - "--model=Qwen/Qwen2.5-3B-Instruct"
            - "--served-model-name=Qwen/Qwen2.5-3B-Instruct"
            - "--device=neuron"
            - "--tensor-parallel-size=2"
            - "--max-model-len=8192"
            - "--port=8000"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              aws.amazon.com/neuron: 1
            limits:
              memory: 24Gi
              aws.amazon.com/neuron: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 30
